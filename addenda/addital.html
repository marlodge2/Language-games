<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gioco ADDENDA versione italiana</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 30px;
        padding-bottom: 50px; /* room for the fixed footer */
      }
      .game-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .column {
        width: 250px;
      }
      .finished {
        background-color: #d4edda; /* light green */
        border-color: #28a745; /* green border */
        color: #155724; /* dark green text */
        font-style: italic; /* optional: makes it feel 'done' */
        pointer-events: none; /* makes the box unclickable */
      }
      .label {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .box {
        border: 2px solid #444;
        padding: 10px;
        min-height: 80px;
        cursor: pointer;
        background-color: white;
      }
      .disabled {
        background-color: #ccc;
        pointer-events: none;
      }
      .hidden {
        visibility: hidden; /* keeps the element's space */
      }
      #instruction {
        font-weight: bold;
        margin-bottom: 16px;
      }
      #intro-box {
        border: 3px solid #444;
        padding: 30px;
        margin: 40px auto;
        width: 60%;
        font-size: 1.5em;
        font-weight: bold;
        background-color: #f0f0f0;
        cursor: pointer;
      }
      #end-controls {
        display: none;
        margin-top: 20px;
      }
      #currentWordDisplay {
        text-align: center;
        font-size: 24px;
        margin-top: 18px;
        font-weight: bold;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-top: 1px solid #ccc;
        box-sizing: border-box;
      }
      #scoreText {
        font-weight: bold;
      }
      #quitLink {
        position: absolute;
        right: 20px;
        font-size: 0.8em;
        color: #888;
        text-decoration: none;
        cursor: pointer;
        display: none;
      }
      #quitLink:hover {
        color: #555;
        text-decoration: underline;
      }
      #soundLabel {
        position: absolute;
        left: 20px;
        font-size: 0.8em;
        color: #888;
        cursor: pointer;
      }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://plausible.io/js/pa-VNPOVeguAik3r5b6-1YbT.js"
    ></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>
  </head>

  <body>
    <h2 id="game-title">ADDENDA</h2>

    <!-- Sound effects -->
    <audio id="pingSound" src="ping.wav" preload="auto"></audio>
    <audio id="errorSound" src="error.wav" preload="auto"></audio>

    <!-- Fixed instruction, shown once the game starts -->
    <div id="instruction"></div>

    <!-- Story grid -->
    <div class="game-grid" id="gameGrid"></div>

    <!-- The word to add, now shown below the stories -->
    <div id="currentWordDisplay"></div>

    <div id="intro-box" onclick="startGame()">
      Un gioco linguistico di John Higgins<br />Maggio, 2026
      <p>Costruisci tre storie, una parola alla volta.</p>
      <p>Clicca qui per iniziare!</p>
    </div>

    <!-- End controls -->
    <div id="end-controls" style="display: none">
      <button
        onclick="startGame()"
        style="padding: 10px 20px; margin-right: 20px"
      >
        Giocare di nuovo
      </button>
      <button onclick="quitGame()" style="padding: 10px 20px">Uscire</button>
    </div>

    <footer id="scoreBox">
      <label id="soundLabel">
        <input
          type="checkbox"
          id="soundToggle"
          onchange="soundEnabled = this.checked"
        />
        Effetti sonori
      </label>
      <span id="scoreText">Score: 0</span>
      <a id="quitLink" onclick="quitToResults()">Uscire</a>
    </footer>

    <script>
      const STORY_DATA = [{"title": "Lettera professionale", "words": ["Gentile", "signor", "Rossi,", "confermo", "l’incontro", "di", "venerdì", "alle", "15:00", "presso", "la", "nostra", "sede.", "Discuteremo", "i", "dettagli", "del", "progetto", "e", "i", "tempi", "di", "consegna.", "La", "ringrazio", "per", "la", "disponibilità", "e", "resto", "a", "disposizione", "per", "ulteriori", "chiarimenti."]}, {"title": "Lettera amichevole", "words": ["Caro", "Luca,", "qui", "tutto", "procede", "bene.", "Le", "giornate", "sono", "luminose", "e", "il", "giardino", "è", "pieno", "di", "fiori.", "Mi", "piacerebbe", "che", "venissi", "presto", "a", "trovarci.", "Mi", "mancano", "le", "nostre", "chiacchierate", "lunghe", "e", "allegre.", "Scrivimi", "appena", "puoi."]}, {"title": "Pubblicità di cibo", "words": ["Scopri", "la", "nostra", "pizza", "artigianale:", "impasto", "leggero,", "ingredienti", "freschi", "e", "sapore", "autentico.", "Oggi", "promozione", "speciale:", "ordina", "due", "pizze", "e", "ricevi", "una", "bibita", "gratis.", "Vieni", "a", "gustare", "la", "tradizione", "italiana", "che", "conquista", "ogni", "palato."]}, {"title": "Brochure di hotel", "words": ["Benvenuti", "all’Hotel", "Sole", "Mediterraneo.", "Camere", "confortevoli,", "colazione", "inclusa", "e", "piscina", "panoramica.", "Rilassatevi", "nel", "nostro", "centro", "benessere", "e", "partecipate", "alle", "escursioni", "guidate.", "Prenotate", "ora", "per", "vivere", "un", "soggiorno", "indimenticabile", "con", "servizio", "attento", "e", "ospitalità", "calorosa."]}, {"title": "Estratto di storia di spie", "words": ["L’agente", "osservava", "la", "strada", "deserta.", "Sapeva", "che", "qualcuno", "lo", "seguiva.", "Il", "documento", "segreto", "era", "nascosto", "nella", "tasca", "interna.", "Un’ombra", "si", "avvicinava", "lentamente.", "Ogni", "secondo", "contava", "e", "la", "missione", "dipendeva", "dalla", "sua", "scelta", "immediata."]}, {"title": "Istruzioni tecniche", "words": ["Per", "installare", "il", "programma,", "scaricare", "il", "file", "dal", "sito", "ufficiale.", "Fare", "doppio", "clic", "sull’icona", "e", "seguire", "le", "istruzioni.", "Accettare", "i", "termini,", "scegliere", "la", "cartella", "di", "destinazione", "e", "premere", "“Installa”.", "Riavviare", "il", "computer", "per", "completare", "l’attivazione."]}, {"title": "Previsioni meteo", "words": ["Oggi", "cielo", "sereno", "al", "mattino,", "con", "temperature", "tra", "18", "e", "23", "gradi.", "Nel", "pomeriggio", "possibili", "nuvole", "e", "piogge", "leggere.", "Il", "vento", "soffierà", "da", "nord,", "rendendo", "l’aria", "fresca.", "Portate", "un", "ombrello", "per", "sicurezza."]}, {"title": "Barzelletta", "words": ["Un", "cliente", "entra", "in", "farmacia", "e", "chiede:", "“Avete", "qualcosa", "contro", "la", "pigrizia?”", "Il", "farmacista", "risponde:", "“Sì,", "ma", "non", "abbiamo", "voglia", "di", "prenderlo", "dallo", "scaffale.”", "Il", "cliente", "ride", "e", "dice:", "“Perfetto,", "allora", "siamo", "in", "sintonia!”"]}];

      const INSTRUCTION_TEXT =
        "Ecco tre storie incompiute. Sotto c'è una nuova parola. Aggiungila alla storia giusta.";

      let soundEnabled = false; // matches the checkbox's unchecked default; kept in sync by its onchange from then on
      let fullTexts = [];
      let titles = [];
      let textOrder = [];
      let progress = [5, 5, 5];
      let boxes = [];
      let correctIndices = [];
      let currentWord = "";
      let score = 0;
      let attempts = 0;
      let previousIndices = []; // the 3 stories just used -- excluded from the very next round only

      function loadTexts() {
        titles = STORY_DATA.map((s) => s.title);
        fullTexts = STORY_DATA.map((s) => s.words.slice());
      }

      function renderBoxContent(i, box, highlightLast) {
        const finished = progress[i] >= fullTexts[textOrder[i]].length;
        const wordsHtml = boxes[i]
          .map((w, wi) =>
            highlightLast && wi === boxes[i].length - 1
              ? `<span style="color:green">${w}</span>`
              : w,
          )
          .join(" ");
        box.innerHTML = wordsHtml + (finished ? "" : " ...");
        if (finished) box.classList.add("finished");
      }

      function startGame() {
        loadTexts();

        document.getElementById("game-title").style.display = "none";
        document.getElementById("intro-box").style.display = "none";
        document.getElementById("end-controls").style.display = "none";
        document.getElementById("quitLink").style.display = "inline";

        document.getElementById("instruction").innerText = INSTRUCTION_TEXT;

        // Skip whichever 3 stories were just used, so a "Play Again" always
        // gets a fresh set; after that round, repeats are fine again.
        let pool = [...Array(titles.length).keys()].filter(
          (i) => !previousIndices.includes(i),
        );
        if (pool.length < 3) pool = [...Array(titles.length).keys()];
        textOrder = shuffle(pool);
        previousIndices = textOrder.slice(0, 3);

        progress = [5, 5, 5];
        boxes = [[], [], []];
        score = 0;
        attempts = 0;
        document.getElementById("scoreText").innerText = "";

        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.id = `text${i}`;
          box.onclick = () => checkAnswer(i);
          boxes[i] = fullTexts[textOrder[i]].slice(0, 5);
          renderBoxContent(i, box, false);
          col.appendChild(box);

          grid.appendChild(col);
        }

        nextWord();
      }

      function quitGame() {
        window.location.href = "index.html";
        document.getElementById("game-title").style.display = "block";
      }

      function quitToResults() {
        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";
        document.getElementById("currentWordDisplay").innerText = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.style.cursor = "default";
          const completeText = fullTexts[textOrder[i]];
          box.innerText = completeText.join(" ");
          col.appendChild(box);

          grid.appendChild(col);
        }

        document.getElementById("instruction").innerText =
          "Gioco terminato. Ecco i testi completi.";
        document.getElementById("end-controls").style.display = "block";
        document.getElementById("quitLink").style.display = "none";
      }

      function shuffle(arr) {
        return arr.sort(() => Math.random() - 0.5);
      }

      function getRemainingIndices() {
        return progress
          .map((p, i) => (p < fullTexts[textOrder[i]].length ? i : null))
          .filter((i) => i !== null);
      }

      function updateScore() {
        const percent =
          attempts === 0 ? 0 : Math.round((score / attempts) * 100);
        document.getElementById("scoreText").innerText =
          `Punteggio: ${percent}% (${score} su ${attempts} tentativi)`;
      }

      function nextWord() {
        const remaining = getRemainingIndices();
        if (remaining.length === 0) {
          document.getElementById("instruction").innerText =
            "Tutti i testi completati! Punteggio finale:";
          updateScore();
          document.getElementById("end-controls").style.display = "block";
          document.getElementById("currentWordDisplay").innerText = "";
          document.getElementById("quitLink").style.display = "none";
          return;
        }

        const sourceIndex =
          remaining[Math.floor(Math.random() * remaining.length)];
        currentWord = fullTexts[textOrder[sourceIndex]][progress[sourceIndex]];

        correctIndices = remaining.filter(
          (i) =>
            progress[i] < fullTexts[textOrder[i]].length &&
            fullTexts[textOrder[i]][progress[i]] === currentWord,
        );

        const wordEl = document.getElementById("currentWordDisplay");
        wordEl.innerText = currentWord;
        wordEl.classList.remove("hidden");

        for (let i = 0; i < 3; i++) {
          const box = document.getElementById(`text${i}`);
          if (progress[i] < fullTexts[textOrder[i]].length) {
            box.classList.remove("disabled");
          }
        }
      }

      function checkAnswer(index) {
        attempts++;
        if (correctIndices.includes(index)) {
          score++;
          const word = fullTexts[textOrder[index]][progress[index]];
          boxes[index].push(word);
          progress[index]++;

          const box = document.getElementById(`text${index}`);
          renderBoxContent(index, box, true);

          if (soundEnabled) {
            document.getElementById("pingSound").play();
          }

          // Hide the word immediately (no jump) while the highlight shows
          document.getElementById("currentWordDisplay").classList.add("hidden");

          setTimeout(() => {
            renderBoxContent(index, box, false);
            setTimeout(nextWord, 200);
          }, 200);
        } else {
          if (soundEnabled) {
            document.getElementById("errorSound").play();
          }
          document.getElementById(`text${index}`).classList.add("disabled");
        }
        updateScore();
      }
    </script>
  </body>
</html>
