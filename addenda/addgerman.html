<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ADDENDA Game German version</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 30px;
        padding-bottom: 50px; /* room for the fixed footer */
      }
      .game-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .column {
        width: 250px;
      }
      .finished {
        background-color: #d4edda; /* light green */
        border-color: #28a745; /* green border */
        color: #155724; /* dark green text */
        font-style: italic; /* optional: makes it feel 'done' */
        pointer-events: none; /* makes the box unclickable */
      }
      .label {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .box {
        border: 2px solid #444;
        padding: 10px;
        min-height: 80px;
        cursor: pointer;
        background-color: white;
      }
      .disabled {
        background-color: #ccc;
        pointer-events: none;
      }
      .hidden {
        visibility: hidden; /* keeps the element's space */
      }
      #instruction {
        font-weight: bold;
        margin-bottom: 16px;
      }
      #intro-box {
        border: 3px solid #444;
        padding: 30px;
        margin: 40px auto;
        width: 60%;
        font-size: 1.5em;
        font-weight: bold;
        background-color: #f0f0f0;
        cursor: pointer;
      }
      #end-controls {
        display: none;
        margin-top: 20px;
      }
      #currentWordDisplay {
        text-align: center;
        font-size: 24px;
        margin-top: 18px;
        font-weight: bold;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-top: 1px solid #ccc;
        box-sizing: border-box;
      }
      #scoreText {
        font-weight: bold;
      }
      #quitLink {
        position: absolute;
        right: 20px;
        font-size: 0.8em;
        color: #888;
        text-decoration: none;
        cursor: pointer;
        display: none;
      }
      #quitLink:hover {
        color: #555;
        text-decoration: underline;
      }
      #soundLabel {
        position: absolute;
        left: 20px;
        font-size: 0.8em;
        color: #888;
        cursor: pointer;
      }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://plausible.io/js/pa-VNPOVeguAik3r5b6-1YbT.js"
    ></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>
  </head>

  <body>
    <h2 id="game-title">ADDENDA</h2>

    <!-- Sound effects -->
    <audio id="pingSound" src="ping.wav" preload="auto"></audio>
    <audio id="errorSound" src="error.wav" preload="auto"></audio>

    <!-- Fixed instruction, shown once the game starts -->
    <div id="instruction"></div>

    <!-- Story grid -->
    <div class="game-grid" id="gameGrid"></div>

    <!-- The word to add, now shown below the stories -->
    <div id="currentWordDisplay"></div>

    <div id="intro-box" onclick="startGame()">
      Ein Sprachspiel von John Higgins<br />Mai 2026
      <p>Baue drei Geschichten auf, ein Wort nach dem anderen.</p>
      <p>Klicke hier, um zu starten!</p>
    </div>

    <!-- End controls -->
    <div id="end-controls" style="display: none">
      <button
        onclick="startGame()"
        style="padding: 10px 20px; margin-right: 20px"
      >
        Noch einmal spielen
      </button>
      <button onclick="quitGame()" style="padding: 10px 20px">Beenden</button>
    </div>

    <footer id="scoreBox">
      <label id="soundLabel">
        <input
          type="checkbox"
          id="soundToggle"
          onchange="soundEnabled = this.checked"
        />
        Toneffekte
      </label>
      <span id="scoreText">Score: 0</span>
      <a id="quitLink" onclick="quitToResults()">Beenden</a>
    </footer>

    <script>
      const STORY_DATA = [{"title": "Geschäftlich", "words": ["Wir", "freuen", "uns,", "Ihnen", "unser", "neues", "Konzept", "für", "effiziente", "Arbeitsabläufe", "präsentieren", "zu", "dürfen.", "Unser", "Fokus", "liegt", "auf", "nachhaltigem", "Wachstum", "und", "der", "Optimierung", "interner", "Strukturen.", "Bitte", "prüfen", "Sie", "das", "beigefügte", "Dokument", "für", "detaillierte", "Spezifikationen.", "Für", "Rückfragen", "oder", "ein", "persönliches", "Gespräch", "stehen", "wir", "Ihnen", "jederzeit", "gerne", "zur", "Verfügung.", "Vielen", "Dank", "für", "Ihr", "Vertrauen"]}, {"title": "Technisch", "words": ["Um", "das", "Gerät", "ordnungsgemäß", "zu", "installieren,", "verbinden", "Sie", "zunächst", "das", "beiliegende", "Netzkabel", "mit", "der", "Steckdose.", "Drücken", "Sie", "anschließend", "die", "Starttaste", "für", "mindestens", "drei", "Sekunden,", "bis", "die", "blaue", "Kontrollleuchte", "blinkt.", "Achten", "Sie", "darauf,", "dass", "die", "Software-Updates", "vollständig", "abgeschlossen", "sind,", "bevor", "Sie", "mit", "der", "Konfiguration", "fortfahren.", "Eine", "falsche", "Handhabung", "kann", "zu", "Systemfehlern", "führen."]}, {"title": "Songkran", "words": ["In", "Thailand", "feiern", "wir", "das", "neue", "Jahr", "an", "drei", "Tagen", "vom", "13.", "bis", "zum", "15.", "April.", "Wir", "nennen", "es", "Songkran", "und", "begehen", "es", "mit", "Zeremonien,", "um", "älteren", "Menschen", "Respekt", "zu", "erweisen.", "Danach", "gehen", "wir", "hinaus", "und", "spielen", "Wasserspiele,", "bei", "denen", "jeder", "nass", "wird."]}, {"title": "Poetisch", "words": ["Der", "Herbstwind", "tanzt", "durch", "das", "goldene", "Laub", "und", "trägt", "den", "Duft", "von", "feuchter", "Erde", "mit", "sich.", "Die", "Sonne", "sinkt", "tiefer,", "während", "die", "Welt", "langsam", "in", "ein", "sanftes", "Violett", "getaucht", "wird.", "Stille", "legt", "sich", "über", "die", "Felder,", "als", "würde", "die", "Natur", "tief", "Luft", "holen,", "bevor", "der", "erste", "Frost", "die", "Zeit", "kurz", "anhält."]}, {"title": "Umgangssprachlich", "words": ["Hey,", "was", "geht", "ab?", "Hast", "du", "schon", "von", "der", "neuen", "Aktion", "in", "der", "Stadt", "gehört?", "Das", "wird", "total", "krass,", "alle", "meine", "Freunde", "sind", "auch", "am", "Start.", "Wir", "treffen", "uns", "später", "am", "Park", "und", "schauen", "mal,", "was", "so", "läuft.", "Sag", "Bescheid,", "wenn", "du", "Bock", "hast", "mitzukommen,", "wir", "schreiben", "dann", "einfach", "später", "bei", "WhatsApp."]}, {"title": "Märchenhaft", "words": ["Es", "war", "einmal", "ein", "tiefer,", "dunkler", "Wald,", "in", "dem", "die", "Bäume", "flüsterten.", "Ein", "kleines", "Schneiderlein", "verlief", "sich", "zwischen", "den", "alten", "Wurzeln.", "Doch", "statt", "sich", "zu", "fürchten,", "suchte", "es", "nach", "dem", "verborgenen", "Schloß", "aus", "Silber.", "In", "der", "Ferne", "funkelte", "ein", "Licht,", "und", "die", "Abenteuer", "des", "mutigen", "Mannes", "nahmen", "ihren", "wundersamen", "Anfang."]}];

      const INSTRUCTION_TEXT =
        "Hier sind drei unvollendete Geschichten. Darunter steht ein neues Wort. Füge es der richtigen Geschichte hinzu.";

      let soundEnabled = false; // matches the checkbox's unchecked default; kept in sync by its onchange from then on
      let fullTexts = [];
      let titles = [];
      let textOrder = [];
      let progress = [5, 5, 5];
      let boxes = [];
      let correctIndices = [];
      let currentWord = "";
      let score = 0;
      let attempts = 0;
      let previousIndices = []; // the 3 stories just used -- excluded from the very next round only

      function loadTexts() {
        titles = STORY_DATA.map((s) => s.title);
        fullTexts = STORY_DATA.map((s) => s.words.slice());
      }

      function renderBoxContent(i, box, highlightLast) {
        const finished = progress[i] >= fullTexts[textOrder[i]].length;
        const wordsHtml = boxes[i]
          .map((w, wi) =>
            highlightLast && wi === boxes[i].length - 1
              ? `<span style="color:green">${w}</span>`
              : w,
          )
          .join(" ");
        box.innerHTML = wordsHtml + (finished ? "" : " ...");
        if (finished) box.classList.add("finished");
      }

      function startGame() {
        loadTexts();

        document.getElementById("game-title").style.display = "none";
        document.getElementById("intro-box").style.display = "none";
        document.getElementById("end-controls").style.display = "none";
        document.getElementById("quitLink").style.display = "inline";

        document.getElementById("instruction").innerText = INSTRUCTION_TEXT;

        // Skip whichever 3 stories were just used, so a "Play Again" always
        // gets a fresh set; after that round, repeats are fine again.
        let pool = [...Array(titles.length).keys()].filter(
          (i) => !previousIndices.includes(i),
        );
        if (pool.length < 3) pool = [...Array(titles.length).keys()];
        textOrder = shuffle(pool);
        previousIndices = textOrder.slice(0, 3);

        progress = [5, 5, 5];
        boxes = [[], [], []];
        score = 0;
        attempts = 0;
        document.getElementById("scoreText").innerText = "";

        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.id = `text${i}`;
          box.onclick = () => checkAnswer(i);
          boxes[i] = fullTexts[textOrder[i]].slice(0, 5);
          renderBoxContent(i, box, false);
          col.appendChild(box);

          grid.appendChild(col);
        }

        nextWord();
      }

      function quitGame() {
        window.location.href = "index.html";
        document.getElementById("game-title").style.display = "block";
      }

      function quitToResults() {
        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";
        document.getElementById("currentWordDisplay").innerText = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.style.cursor = "default";
          const completeText = fullTexts[textOrder[i]];
          box.innerText = completeText.join(" ");
          col.appendChild(box);

          grid.appendChild(col);
        }

        document.getElementById("instruction").innerText =
          "Spiel beendet. Hier sind die vollständigen Texte.";
        document.getElementById("end-controls").style.display = "block";
        document.getElementById("quitLink").style.display = "none";
      }

      function shuffle(arr) {
        return arr.sort(() => Math.random() - 0.5);
      }

      function getRemainingIndices() {
        return progress
          .map((p, i) => (p < fullTexts[textOrder[i]].length ? i : null))
          .filter((i) => i !== null);
      }

      function updateScore() {
        const percent =
          attempts === 0 ? 0 : Math.round((score / attempts) * 100);
        document.getElementById("scoreText").innerText =
          `Ergebnis: ${percent}% (${score} von ${attempts} Versuchen)`;
      }

      function nextWord() {
        const remaining = getRemainingIndices();
        if (remaining.length === 0) {
          document.getElementById("instruction").innerText =
            "Alle Texte abgeschlossen! Endergebnis:";
          updateScore();
          document.getElementById("end-controls").style.display = "block";
          document.getElementById("currentWordDisplay").innerText = "";
          document.getElementById("quitLink").style.display = "none";
          return;
        }

        const sourceIndex =
          remaining[Math.floor(Math.random() * remaining.length)];
        currentWord = fullTexts[textOrder[sourceIndex]][progress[sourceIndex]];

        correctIndices = remaining.filter(
          (i) =>
            progress[i] < fullTexts[textOrder[i]].length &&
            fullTexts[textOrder[i]][progress[i]] === currentWord,
        );

        const wordEl = document.getElementById("currentWordDisplay");
        wordEl.innerText = currentWord;
        wordEl.classList.remove("hidden");

        for (let i = 0; i < 3; i++) {
          const box = document.getElementById(`text${i}`);
          if (progress[i] < fullTexts[textOrder[i]].length) {
            box.classList.remove("disabled");
          }
        }
      }

      function checkAnswer(index) {
        attempts++;
        if (correctIndices.includes(index)) {
          score++;
          const word = fullTexts[textOrder[index]][progress[index]];
          boxes[index].push(word);
          progress[index]++;

          const box = document.getElementById(`text${index}`);
          renderBoxContent(index, box, true);

          if (soundEnabled) {
            document.getElementById("pingSound").play();
          }

          // Hide the word immediately (no jump) while the highlight shows
          document.getElementById("currentWordDisplay").classList.add("hidden");

          setTimeout(() => {
            renderBoxContent(index, box, false);
            setTimeout(nextWord, 200);
          }, 200);
        } else {
          if (soundEnabled) {
            document.getElementById("errorSound").play();
          }
          document.getElementById(`text${index}`).classList.add("disabled");
        }
        updateScore();
      }
    </script>
  </body>
</html>
