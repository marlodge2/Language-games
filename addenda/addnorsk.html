<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>ADDENDA Norwegian version</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 30px;
        padding-bottom: 50px; /* room for the fixed footer */
      }
      .game-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .column {
        width: 250px;
      }
      .finished {
        background-color: #d4edda; /* light green */
        border-color: #28a745; /* green border */
        color: #155724; /* dark green text */
        font-style: italic; /* optional: makes it feel 'done' */
        pointer-events: none; /* makes the box unclickable */
      }
      .label {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .box {
        border: 2px solid #444;
        padding: 10px;
        min-height: 80px;
        cursor: pointer;
        background-color: white;
      }
      .disabled {
        background-color: #ccc;
        pointer-events: none;
      }
      .hidden {
        visibility: hidden; /* keeps the element's space */
      }
      #instruction {
        font-weight: bold;
        margin-bottom: 16px;
      }
      #intro-box {
        border: 3px solid #444;
        padding: 30px;
        margin: 40px auto;
        width: 60%;
        font-size: 1.5em;
        font-weight: bold;
        background-color: #f0f0f0;
        cursor: pointer;
      }
      #end-controls {
        display: none;
        margin-top: 20px;
      }
      #currentWordDisplay {
        text-align: center;
        font-size: 24px;
        margin-top: 18px;
        font-weight: bold;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-top: 1px solid #ccc;
        box-sizing: border-box;
      }
      #scoreText {
        font-weight: bold;
      }
      #quitLink {
        position: absolute;
        right: 20px;
        font-size: 0.8em;
        color: #888;
        text-decoration: none;
        cursor: pointer;
        display: none;
      }
      #quitLink:hover {
        color: #555;
        text-decoration: underline;
      }
      #soundLabel {
        position: absolute;
        left: 20px;
        font-size: 0.8em;
        color: #888;
        cursor: pointer;
      }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://plausible.io/js/pa-VNPOVeguAik3r5b6-1YbT.js"
    ></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>
  </head>

  <body>
    <h2 id="game-title">ADDENDA</h2>

    <!-- Sound effects -->
    <audio id="pingSound" src="ping.wav" preload="auto"></audio>
    <audio id="errorSound" src="error.wav" preload="auto"></audio>

    <!-- Fixed instruction, shown once the game starts -->
    <div id="instruction"></div>

    <!-- Story grid -->
    <div class="game-grid" id="gameGrid"></div>

    <!-- The word to add, now shown below the stories -->
    <div id="currentWordDisplay"></div>

    <div id="intro-box" onclick="startGame()">
      Et språkspill av John Higgins, mai 2026.
      <p>Bygg tre historier, ett ord om gangen.</p>
      <p>Klikk her for å starte!</p>
    </div>

    <!-- End controls -->
    <div id="end-controls" style="display: none">
      <button
        onclick="startGame()"
        style="padding: 10px 20px; margin-right: 20px"
      >
        Spill igjen
      </button>
      <button onclick="quitGame()" style="padding: 10px 20px">Avslutt</button>
    </div>

    <footer id="scoreBox">
      <label id="soundLabel">
        <input
          type="checkbox"
          id="soundToggle"
          onchange="soundEnabled = this.checked"
        />
        Lydeffekter
      </label>
      <span id="scoreText">Score: 0</span>
      <a id="quitLink" onclick="quitToResults()">Avslutt</a>
    </footer>

    <script>
      const STORY_DATA = [{"title": "Solhotellet", "words": ["Velkommen", "til", "Solhotellet,", "midt", "i", "byen.", "Her", "kan", "du", "nyte", "elegante", "rom,", "vennlig", "service", "og", "en", "fantastisk", "utsikt", "over", "havet.", "Bestill", "i", "dag", "for", "en", "uforglemmelig", "opplevelse", "som", "kombinerer", "moderne", "komfort", "med", "ekte", "sjarm.", "Din", "drømmeferie", "begynner", "her."]}, {"title": "Værmelding", "words": ["I", "dag", "blir", "himmelen", "delvis", "skyet", "med", "noen", "oppklaringer", "utover", "ettermiddagen.", "Temperaturen", "vil", "ligge", "mellom", "18", "og", "24", "grader.", "En", "lett", "nordavind", "gir", "en", "frisk", "følelse.", "Ta", "med", "paraply,", "for", "det", "er", "ventet", "en", "liten", "regnbyge", "i", "kveld."]}, {"title": "Profesjonelt brev", "words": ["Kjære", "frue,", "herr.", "Jeg", "skriver", "for", "å", "bekrefte", "vårt", "møte", "den", "15.", "mai", "klokken", "10", "i", "deres", "kontor.", "Vi", "skal", "diskutere", "vilkårene", "for", "vårt", "samarbeid", "og", "de", "neste", "stegene.", "Takk", "for", "at", "dere", "stiller", "opp,", "jeg", "står", "til", "disposisjon", "for", "ytterligere", "detaljer.", "Vennlig", "hilsen,", "Jean", "Dupont."]}, {"title": "Teknisk instruksjon", "words": ["For", "å", "installere", "programvaren,", "last", "først", "ned", "filen", "fra", "vår", "offisielle", "nettside.", "Dobbeltklikk", "deretter", "på", "ikonet", "og", "følg", "trinnene", "på", "skjermen.", "Godkjenn", "vilkårene,", "velg", "installasjonsmappe", "og", "klikk", "på", "‘Installer’.", "Når", "alt", "er", "ferdig,", "start", "datamaskinen", "på", "nytt", "for", "å", "aktivere", "funksjonene."]}, {"title": "Vits", "words": ["En", "pasient", "sier", "til", "legen:", "Doktor,", "jeg", "har", "vondt", "overalt!", "Når", "jeg", "tar", "på", "hodet,", "gjør", "det", "vondt.", "Når", "jeg", "tar", "på", "armen,", "gjør", "det", "vondt.", "Når", "jeg", "tar", "på", "benet,", "gjør", "det", "vondt…", "Legen", "tenker", "seg", "om", "og", "svarer:", "Jeg", "tror", "fingeren", "din", "er", "brukket!"]}, {"title": "Vennlig brev", "words": ["Kjære", "venn,", "Jeg", "håper", "du", "har", "det", "bra.", "Her", "går", "alt", "fint:", "våren", "er", "kommet", "og", "blomstene", "fyller", "hagen", "med", "farger.", "Jeg", "tenker", "ofte", "på", "våre", "turer", "og", "ønsker", "at", "vi", "snart", "kan", "gå", "en", "ny.", "Skriv", "til", "meg", "snart,", "jeg", "savner", "deg.", "Kjærlig", "hilsen,", "Claire."]}, {"title": "Offentlig kunngjøring", "words": ["Oppmerksomhet,", "kjære", "innbyggere!", "Kommunen", "informerer", "om", "at", "søppelhentingen", "denne", "uken", "skjer", "onsdag", "morgen", "i", "stedet", "for", "torsdag.", "Vennligst", "sett", "ut", "dunkene", "kvelden", "før.", "Sammen", "holder", "vi", "nabolaget", "rent", "og", "hyggelig", "for", "alle."]}, {"title": "Songkran", "words": ["I", "Thailand", "feirer", "vi", "nyttår", "i", "tre", "dager,", "fra", "13.", "til", "15.", "april.", "Denne", "festen", "kalles", "Songkran,", "og", "markeres", "med", "seremonier", "for", "å", "vise", "respekt", "til", "eldre.", "Deretter", "går", "vi", "ut", "og", "leker", "vannleker", "der", "alle", "blir", "gjennomvåte", "til", "slutt."]}];

      const INSTRUCTION_TEXT =
        "Her er tre uferdige historier. Under er et nytt ord. Legg det til riktig historie.";

      let soundEnabled = false; // matches the checkbox's unchecked default; kept in sync by its onchange from then on
      let fullTexts = [];
      let titles = [];
      let textOrder = [];
      let progress = [5, 5, 5];
      let boxes = [];
      let correctIndices = [];
      let currentWord = "";
      let score = 0;
      let attempts = 0;
      let previousIndices = []; // the 3 stories just used -- excluded from the very next round only

      function loadTexts() {
        titles = STORY_DATA.map((s) => s.title);
        fullTexts = STORY_DATA.map((s) => s.words.slice());
      }

      function renderBoxContent(i, box, highlightLast) {
        const finished = progress[i] >= fullTexts[textOrder[i]].length;
        const wordsHtml = boxes[i]
          .map((w, wi) =>
            highlightLast && wi === boxes[i].length - 1
              ? `<span style="color:green">${w}</span>`
              : w,
          )
          .join(" ");
        box.innerHTML = wordsHtml + (finished ? "" : " ...");
        if (finished) box.classList.add("finished");
      }

      function startGame() {
        loadTexts();

        document.getElementById("game-title").style.display = "none";
        document.getElementById("intro-box").style.display = "none";
        document.getElementById("end-controls").style.display = "none";
        document.getElementById("quitLink").style.display = "inline";

        document.getElementById("instruction").innerText = INSTRUCTION_TEXT;

        // Skip whichever 3 stories were just used, so a "Play Again" always
        // gets a fresh set; after that round, repeats are fine again.
        let pool = [...Array(titles.length).keys()].filter(
          (i) => !previousIndices.includes(i),
        );
        if (pool.length < 3) pool = [...Array(titles.length).keys()];
        textOrder = shuffle(pool);
        previousIndices = textOrder.slice(0, 3);

        progress = [5, 5, 5];
        boxes = [[], [], []];
        score = 0;
        attempts = 0;
        document.getElementById("scoreText").innerText = "";

        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.id = `text${i}`;
          box.onclick = () => checkAnswer(i);
          boxes[i] = fullTexts[textOrder[i]].slice(0, 5);
          renderBoxContent(i, box, false);
          col.appendChild(box);

          grid.appendChild(col);
        }

        nextWord();
      }

      function quitGame() {
        window.location.href = "index.html";
        document.getElementById("game-title").style.display = "block";
      }

      function quitToResults() {
        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";
        document.getElementById("currentWordDisplay").innerText = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.style.cursor = "default";
          const completeText = fullTexts[textOrder[i]];
          box.innerText = completeText.join(" ");
          col.appendChild(box);

          grid.appendChild(col);
        }

        document.getElementById("instruction").innerText =
          "Spillet er slutt. Her er de komplette tekstene.";
        document.getElementById("end-controls").style.display = "block";
        document.getElementById("quitLink").style.display = "none";
      }

      function shuffle(arr) {
        return arr.sort(() => Math.random() - 0.5);
      }

      function getRemainingIndices() {
        return progress
          .map((p, i) => (p < fullTexts[textOrder[i]].length ? i : null))
          .filter((i) => i !== null);
      }

      function updateScore() {
        const percent =
          attempts === 0 ? 0 : Math.round((score / attempts) * 100);
        document.getElementById("scoreText").innerText =
          `Poengsum: ${percent}% (${score} av ${attempts} forsøk)`;
      }

      function nextWord() {
        const remaining = getRemainingIndices();
        if (remaining.length === 0) {
          document.getElementById("instruction").innerText =
            "Alle tekstene er fullført! Sluttpoeng:";
          updateScore();
          document.getElementById("end-controls").style.display = "block";
          document.getElementById("currentWordDisplay").innerText = "";
          document.getElementById("quitLink").style.display = "none";
          return;
        }

        const sourceIndex =
          remaining[Math.floor(Math.random() * remaining.length)];
        currentWord = fullTexts[textOrder[sourceIndex]][progress[sourceIndex]];

        correctIndices = remaining.filter(
          (i) =>
            progress[i] < fullTexts[textOrder[i]].length &&
            fullTexts[textOrder[i]][progress[i]] === currentWord,
        );

        const wordEl = document.getElementById("currentWordDisplay");
        wordEl.innerText = currentWord;
        wordEl.classList.remove("hidden");

        for (let i = 0; i < 3; i++) {
          const box = document.getElementById(`text${i}`);
          if (progress[i] < fullTexts[textOrder[i]].length) {
            box.classList.remove("disabled");
          }
        }
      }

      function checkAnswer(index) {
        attempts++;
        if (correctIndices.includes(index)) {
          score++;
          const word = fullTexts[textOrder[index]][progress[index]];
          boxes[index].push(word);
          progress[index]++;

          const box = document.getElementById(`text${index}`);
          renderBoxContent(index, box, true);

          if (soundEnabled) {
            document.getElementById("pingSound").play();
          }

          // Hide the word immediately (no jump) while the highlight shows
          document.getElementById("currentWordDisplay").classList.add("hidden");

          setTimeout(() => {
            renderBoxContent(index, box, false);
            setTimeout(nextWord, 200);
          }, 200);
        } else {
          if (soundEnabled) {
            document.getElementById("errorSound").play();
          }
          document.getElementById(`text${index}`).classList.add("disabled");
        }
        updateScore();
      }
    </script>
  </body>
</html>
