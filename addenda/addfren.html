<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ADDENDA Game French version</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 30px;
        padding-bottom: 50px; /* room for the fixed footer */
      }
      .game-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .column {
        width: 250px;
      }
      .finished {
        background-color: #d4edda; /* light green */
        border-color: #28a745; /* green border */
        color: #155724; /* dark green text */
        font-style: italic; /* optional: makes it feel 'done' */
        pointer-events: none; /* makes the box unclickable */
      }
      .label {
        font-weight: bold;
        margin-bottom: 5px;
      }
      .box {
        border: 2px solid #444;
        padding: 10px;
        min-height: 80px;
        cursor: pointer;
        background-color: white;
      }
      .disabled {
        background-color: #ccc;
        pointer-events: none;
      }
      .hidden {
        visibility: hidden; /* keeps the element's space */
      }
      #instruction {
        font-weight: bold;
        margin-bottom: 16px;
      }
      #intro-box {
        border: 3px solid #444;
        padding: 30px;
        margin: 40px auto;
        width: 60%;
        font-size: 1.5em;
        font-weight: bold;
        background-color: #f0f0f0;
        cursor: pointer;
      }
      #end-controls {
        display: none;
        margin-top: 20px;
      }
      #currentWordDisplay {
        text-align: center;
        font-size: 24px;
        margin-top: 18px;
        font-weight: bold;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-top: 1px solid #ccc;
        box-sizing: border-box;
      }
      #scoreText {
        font-weight: bold;
      }
      #quitLink {
        position: absolute;
        right: 20px;
        font-size: 0.8em;
        color: #888;
        text-decoration: none;
        cursor: pointer;
        display: none;
      }
      #quitLink:hover {
        color: #555;
        text-decoration: underline;
      }
      #soundLabel {
        position: absolute;
        left: 20px;
        font-size: 0.8em;
        color: #888;
        cursor: pointer;
      }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://plausible.io/js/pa-VNPOVeguAik3r5b6-1YbT.js"
    ></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>
  </head>

  <body>
    <h2 id="game-title">ADDENDA</h2>

    <!-- Sound effects -->
    <audio id="pingSound" src="ping.wav" preload="auto"></audio>
    <audio id="errorSound" src="error.wav" preload="auto"></audio>

    <!-- Fixed instruction, shown once the game starts -->
    <div id="instruction"></div>

    <!-- Story grid -->
    <div class="game-grid" id="gameGrid"></div>

    <!-- The word to add, now shown below the stories -->
    <div id="currentWordDisplay"></div>

    <div id="intro-box" onclick="startGame()">
      Un jeu de langue par John Higgins, mai 2026.
      <p>Construis trois histoires, un mot à la fois.</p>
      <p>Clique ici pour commencer!</p>
    </div>

    <!-- End controls -->
    <div id="end-controls" style="display: none">
      <button
        onclick="startGame()"
        style="padding: 10px 20px; margin-right: 20px"
      >
        Rejouer
      </button>
      <button onclick="quitGame()" style="padding: 10px 20px">Quitter</button>
    </div>

    <footer id="scoreBox">
      <label id="soundLabel">
        <input
          type="checkbox"
          id="soundToggle"
          onchange="soundEnabled = this.checked"
        />
        Effets sonores
      </label>
      <span id="scoreText">Score: 0</span>
      <a id="quitLink" onclick="quitToResults()">Quitter</a>
    </footer>

    <script>
      const STORY_DATA = [{"title": "Hôtel du Soleil", "words": ["Bienvenue", "à", "l’Hôtel", "du", "Soleil,", "situé", "au", "cœur", "de", "la", "ville.", "Profitez", "de", "chambres", "élégantes,", "d’un", "service", "chaleureux", "et", "d’une", "vue", "imprenable", "sur", "la", "mer.", "Réservez", "dès", "aujourd’hui", "pour", "vivre", "une", "expérience", "inoubliable,", "entre", "confort", "moderne", "et", "charme", "authentique.", "Votre", "séjour", "de", "rêve", "commence", "ici."]}, {"title": "Bulletin météo", "words": ["Aujourd’hui,", "le", "ciel", "restera", "partiellement", "nuageux", "avec", "quelques", "éclaircies", "dans", "l’après-midi.", "Les", "températures", "oscilleront", "entre", "18", "et", "24", "degrés.", "Un", "vent", "léger", "du", "nord", "apportera", "une", "sensation", "de", "fraîcheur.", "Préparez", "un", "parapluie,", "car", "une", "petite", "pluie", "est", "attendue", "en", "soirée."]}, {"title": "Lettre professionnelle", "words": ["Madame,", "Monsieur,", "Je", "vous", "écris", "afin", "de", "confirmer", "notre", "rendez-vous", "prévu", "le", "15", "mai", "à", "10h", "dans", "vos", "bureaux.", "Nous", "discuterons", "des", "conditions", "de", "notre", "partenariat", "et", "des", "prochaines", "étapes.", "Je", "vous", "remercie", "de", "votre", "disponibilité", "et", "reste", "à", "votre", "disposition", "pour", "toute", "précision.", "Cordialement,", "Jean", "Dupont"]}, {"title": "Instruction technique", "words": ["Pour", "installer", "le", "logiciel,", "commencez", "par", "télécharger", "le", "fichier", "depuis", "notre", "site", "officiel.", "Double-cliquez", "ensuite", "sur", "l’icône", "et", "suivez", "les", "étapes", "indiquées", "à", "l’écran.", "Acceptez", "les", "conditions,", "choisissez", "le", "dossier", "d’installation,", "puis", "cliquez", "sur", "'Installer'.", "Une", "fois", "terminé,", "redémarrez", "votre", "ordinateur", "pour", "activer", "toutes", "les", "fonctionnalités."]}, {"title": "La blague", "words": ["Un", "patient", "dit", "à", "son", "médecin:", "Docteur,", "j’ai", "mal", "partout!", "Quand", "je", "touche", "ma", "tête,", "ça", "fait", "mal.", "Quand", "je", "touche", "mon", "bras,", "ça", "fait", "mal.", "Quand", "je", "touche", "ma", "jambe,", "ça", "fait", "mal…", "Le", "médecin", "réfléchit", "et", "répond:", "Je", "crois", "que", "votre", "doigt", "est", "cassé!"]}, {"title": "Lettre amicale", "words": ["Cher", "ami,", "J’espère", "que", "tu", "vas", "bien.", "Ici,", "tout", "se", "passe", "à", "merveille:", "le", "printemps", "est", "arrivé", "et", "les", "fleurs", "colorent", "le", "jardin.", "Je", "pense", "souvent", "à", "nos", "promenades", "et", "j’aimerais", "que", "nous", "en", "fassions", "bientôt", "une", "nouvelle.", "Écris-moi", "vite,", "ton", "absence", "se", "fait", "sentir.", "Affectueusement,", "Claire"]}, {"title": "Annonce publique", "words": ["Attention,", "chers", "habitants!", "La", "mairie", "informe", "que", "la", "collecte", "des", "déchets", "aura", "lieu", "exceptionnellement", "mercredi", "matin", "au", "lieu", "de", "jeudi.", "Merci", "de", "sortir", "vos", "poubelles", "la", "veille", "au", "soir.", "Ensemble,", "gardons", "notre", "quartier", "propre", "et", "agréable", "pour", "tous."]}, {"title": "Songkran", "words": ["En", "Thaïlande,", "nous", "célébrons", "le", "Nouvel", "An", "pendant", "trois", "jours,", "du", "13", "au", "15", "avril.", "Nous", "appelons", "cette", "fête", "Songkran,", "et", "nous", "la", "marquons", "par", "des", "cérémonies", "destinées", "à", "montrer", "du", "respect", "aux", "personnes", "âgées.", "Ensuite,", "nous", "sortons", "pour", "jouer", "à", "des", "jeux", "d’eau", "où", "tout", "le", "monde", "finit", "par", "être", "trempé."]}];

      const INSTRUCTION_TEXT =
        "Voici trois histoires inachevées. Un nouveau mot apparaît en dessous. Ajoute-le à la bonne histoire.";

      let soundEnabled = false; // matches the checkbox's unchecked default; kept in sync by its onchange from then on
      let fullTexts = [];
      let titles = [];
      let textOrder = [];
      let progress = [5, 5, 5];
      let boxes = [];
      let correctIndices = [];
      let currentWord = "";
      let score = 0;
      let attempts = 0;
      let previousIndices = []; // the 3 stories just used -- excluded from the very next round only

      function loadTexts() {
        titles = STORY_DATA.map((s) => s.title);
        fullTexts = STORY_DATA.map((s) => s.words.slice());
      }

      function renderBoxContent(i, box, highlightLast) {
        const finished = progress[i] >= fullTexts[textOrder[i]].length;
        const wordsHtml = boxes[i]
          .map((w, wi) =>
            highlightLast && wi === boxes[i].length - 1
              ? `<span style="color:green">${w}</span>`
              : w,
          )
          .join(" ");
        box.innerHTML = wordsHtml + (finished ? "" : " ...");
        if (finished) box.classList.add("finished");
      }

      function startGame() {
        loadTexts();

        document.getElementById("game-title").style.display = "none";
        document.getElementById("intro-box").style.display = "none";
        document.getElementById("end-controls").style.display = "none";
        document.getElementById("quitLink").style.display = "inline";

        document.getElementById("instruction").innerText = INSTRUCTION_TEXT;

        // Skip whichever 3 stories were just used, so a "Play Again" always
        // gets a fresh set; after that round, repeats are fine again.
        let pool = [...Array(titles.length).keys()].filter(
          (i) => !previousIndices.includes(i),
        );
        if (pool.length < 3) pool = [...Array(titles.length).keys()];
        textOrder = shuffle(pool);
        previousIndices = textOrder.slice(0, 3);

        progress = [5, 5, 5];
        boxes = [[], [], []];
        score = 0;
        attempts = 0;
        document.getElementById("scoreText").innerText = "";

        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.id = `text${i}`;
          box.onclick = () => checkAnswer(i);
          boxes[i] = fullTexts[textOrder[i]].slice(0, 5);
          renderBoxContent(i, box, false);
          col.appendChild(box);

          grid.appendChild(col);
        }

        nextWord();
      }

      function quitGame() {
        window.location.href = "index.html";
        document.getElementById("game-title").style.display = "block";
      }

      function quitToResults() {
        const grid = document.getElementById("gameGrid");
        grid.innerHTML = "";
        document.getElementById("currentWordDisplay").innerText = "";

        for (let i = 0; i < 3; i++) {
          const col = document.createElement("div");
          col.className = "column";

          const label = document.createElement("div");
          label.className = "label";
          label.innerText = titles[textOrder[i]];
          col.appendChild(label);

          const box = document.createElement("div");
          box.className = "box";
          box.style.cursor = "default";
          const completeText = fullTexts[textOrder[i]];
          box.innerText = completeText.join(" ");
          col.appendChild(box);

          grid.appendChild(col);
        }

        document.getElementById("instruction").innerText =
          "Jeu terminé. Voici les textes complets.";
        document.getElementById("end-controls").style.display = "block";
        document.getElementById("quitLink").style.display = "none";
      }

      function shuffle(arr) {
        return arr.sort(() => Math.random() - 0.5);
      }

      function getRemainingIndices() {
        return progress
          .map((p, i) => (p < fullTexts[textOrder[i]].length ? i : null))
          .filter((i) => i !== null);
      }

      function updateScore() {
        const percent =
          attempts === 0 ? 0 : Math.round((score / attempts) * 100);
        document.getElementById("scoreText").innerText =
          `Score: ${percent}% (${score} de ${attempts} essais)`;
      }

      function nextWord() {
        const remaining = getRemainingIndices();
        if (remaining.length === 0) {
          document.getElementById("instruction").innerText =
            "Tous les textes terminés! Score final:";
          updateScore();
          document.getElementById("end-controls").style.display = "block";
          document.getElementById("currentWordDisplay").innerText = "";
          document.getElementById("quitLink").style.display = "none";
          return;
        }

        const sourceIndex =
          remaining[Math.floor(Math.random() * remaining.length)];
        currentWord = fullTexts[textOrder[sourceIndex]][progress[sourceIndex]];

        correctIndices = remaining.filter(
          (i) =>
            progress[i] < fullTexts[textOrder[i]].length &&
            fullTexts[textOrder[i]][progress[i]] === currentWord,
        );

        const wordEl = document.getElementById("currentWordDisplay");
        wordEl.innerText = currentWord;
        wordEl.classList.remove("hidden");

        for (let i = 0; i < 3; i++) {
          const box = document.getElementById(`text${i}`);
          if (progress[i] < fullTexts[textOrder[i]].length) {
            box.classList.remove("disabled");
          }
        }
      }

      function checkAnswer(index) {
        attempts++;
        if (correctIndices.includes(index)) {
          score++;
          const word = fullTexts[textOrder[index]][progress[index]];
          boxes[index].push(word);
          progress[index]++;

          const box = document.getElementById(`text${index}`);
          renderBoxContent(index, box, true);

          if (soundEnabled) {
            document.getElementById("pingSound").play();
          }

          // Hide the word immediately (no jump) while the highlight shows
          document.getElementById("currentWordDisplay").classList.add("hidden");

          setTimeout(() => {
            renderBoxContent(index, box, false);
            setTimeout(nextWord, 200);
          }, 200);
        } else {
          if (soundEnabled) {
            document.getElementById("errorSound").play();
          }
          document.getElementById(`text${index}`).classList.add("disabled");
        }
        updateScore();
      }
    </script>
  </body>
</html>
